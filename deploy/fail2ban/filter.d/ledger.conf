# fail2ban filter for the ledger login log.
#
# The service writes one line per rejected login:
#   ledger: login failed for "alice" from 203.0.113.7
# The attempted username is quoted with Go's %q, so it always stays on one line.
# The leading .* absorbs the timestamp the service prints, and being greedy it
# also makes <HOST> bind to the trailing peer address rather than to anything a
# hostile username might contain.

[Definition]

failregex = ^(?:.*\s)?ledger: login failed for .* from <HOST>\s*$

ignoreregex =

journalmatch = _SYSTEMD_UNIT=ledger.service
