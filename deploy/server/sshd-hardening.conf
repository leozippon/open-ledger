# Key-only SSH access. Installed by provision.sh as
# /etc/ssh/sshd_config.d/10-hardening.conf, which overrides the defaults in
# /etc/ssh/sshd_config.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
