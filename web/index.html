<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7">
<script>
try {
  var pref = localStorage.getItem('ledger-theme');
  var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  var accent = localStorage.getItem('ledger-accent');
  if (accent !== 'red' && accent !== 'pink' && accent !== 'violet' && accent !== 'teal' && accent !== 'orange') accent = 'blue';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.accent = accent;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f7');
} catch (error) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>记账</title>
<link rel="apple-touch-icon" href="/ledger-mark.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div></div>

<section id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-mark" src="/icon.svg" alt="" width="64" height="64">
    <h1>记账</h1>
    <p class="login-hint" id="login-hint">登录自己的账本</p>
    <input id="login-username" class="input" type="text" placeholder="用户名" autocomplete="username"
           autocapitalize="none" spellcheck="false" required>
    <input id="login-password" class="input" type="password" placeholder="密码" autocomplete="current-password" required>
    <p id="login-error" class="login-error" hidden></p>
    <button id="login-submit" class="btn btn-primary" type="submit">登录</button>
    <button id="login-switch" class="login-switch" type="button" hidden>注册，开一本自己的账</button>
  </form>
</section>

<div id="app" class="app" hidden>
  <main id="view" class="view"></main>
  <!-- Icons are inline strokes so they follow the tab colour in both themes. -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" type="button" data-tab="home">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg>
      <span class="tab-label">账本</span>
    </button>
    <button class="tab tab-add" type="button" data-tab="add" aria-label="记一笔">
      <span class="plus"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
      <span class="tab-label">我的</span>
    </button>
  </nav>
</div>

<div id="layers" class="layers"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
